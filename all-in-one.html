<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Табло для стрима</title>
  <style>
    body { 
      margin: 0; 
      font-family: 'Arial Black', sans-serif; 
      overflow: hidden; 
      color: white; 
      text-shadow: 2px 2px 0 #000; 
      background: rgba(0,0,0,0); 
      height: 100vh;
    }

    /* --- ЭТО ВИДНО В OBS (Чистый экран) --- */
    .display-mode .controls-panel { display: none !important; } 
    
    .scoreboard { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 20px; 
      gap: 60px; 
      height: 100%; 
      box-sizing: border-box; 
    }
    .team { text-align: center; flex: 1; }
    .name { font-size: 24px; font-weight: bold; text-transform: uppercase; }
    .score { font-size: 80px; font-weight: bold; }
    .timer { text-align: center; min-width: 150px; }
    #clock { font-size: 72px; font-weight: bold; }

    /* --- ЭТО ВИДНО ТОЛЬКО ТЕБЕ (Панель) --- */
    .controls-panel {
      position: fixed; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); 
      padding: 15px; 
      border-radius: 12px;
      display: grid; 
      grid-template-columns: auto auto auto; 
      gap: 10px; 
      z-index: 9999;
      backdrop-filter: blur(5px);
    }
    button { 
      padding: 10px 20px; 
      font-size: 16px; 
      cursor: pointer; 
      background: #fff; 
      color: #000;
      border: none; 
      border-radius: 4px; 
    }
    button:hover { background: #ddd; }
    input { 
      padding: 8px; 
      text-align: center; 
      width: 80px; 
      background: #333; 
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }
  </style>
</head>
<body class="display-mode">

  <!-- Табло -->
  <div class="scoreboard">
    <div class="team">
      <div class="name">Команда А</div>
      <div class="score" id="score-home">0</div>
    </div>

    <div class="timer">
      <div id="clock">00:00</div>
    </div>

    <div class="team">
      <div class="name">Команда B</div>
      <div class="score" id="score-away">0</div>
    </div>
  </div>

  <!-- Панель управления -->
  <div class="controls-panel">
    <span></span>
    <b>Счёт</b>
    <span></span>

    <label>А:</label>
    <button onclick="changeScore('home', 1)">+1</button>
    <button onclick="changeScore('home', -1)">-1</button>

    <label>B:</label>
    <button onclick="changeScore('away', 1)">+1</button>
    <button onclick="changeScore('away', -1)">-1</button>

    <label>Время (сек):</label>
    <input type="number" id="time-input" value="5400">
    <button onclick="setTime()">Установить</button>
  </div>

  <script>
    // 1. Загрузка данных из памяти браузера (localStorage)
    let state = JSON.parse(localStorage.getItem('myScoreboardState')) || { home: 0, away: 0, timeSeconds: 5400 };
    
    function save() { localStorage.setItem('myScoreboardState', JSON.stringify(state)); }
    
    function render() {
      document.getElementById('score-home').textContent = state.home;
      document.getElementById('score-away').textContent = state.away;
      
      const m = Math.floor(state.timeSeconds / 60).toString().padStart(2, '0');
      const s = (state.timeSeconds % 60).toString().padStart(2, '0');
      document.getElementById('clock').textContent = m + ':' + s;
    }

    // 2. Логика кнопок
    function changeScore(team, delta) {
      state[team] += delta;
      save();
      render();
    }

    function setTime() {
      const val = parseInt(document.getElementById('time-input').value);
      if (!isNaN(val)) {
        state.timeSeconds = val;
        save();
        render();
      }
    }

    // Запуск отрисовки
    render();

    // МАГИЯ ДЛЯ OBS: Проверка URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'obs') {
      // Если в ссылке есть ?mode=obs — скрываем кнопки
      document.body.classList.add('display-mode');
    } else {
      // Иначе показываем кнопки (для тебя)
      document.body.classList.remove('display-mode'); 
    }
  </script>
</body>
</html>
